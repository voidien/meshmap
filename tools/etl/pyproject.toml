[project]
name = "meshmap-etl"
version = "0.1.0"
description = "Builds meshmap terrain packs (bare earth + clutter tiles) from USGS 3DEP, lidar, canopy height and building footprints"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "laspy[lazrs]>=2.5",
  "pyarrow>=14",
  "shapely>=2.0",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
meshmap-etl = "meshmap_etl.cli:main"

[tool.setuptools.packages.find]
include = ["meshmap_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
