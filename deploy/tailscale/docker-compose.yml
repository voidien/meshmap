# Tailscale sidecar for meshmap, as its own compose project.
#
#   1. start meshmap first (repo root):      docker compose up --build -d
#   2. then, from this directory:            cp .env.example .env   # set TS_AUTHKEY
#                                            docker compose up -d
#
# It joins meshmap's network (meshmap-net) and publishes http://meshmap-web:8080 on your tailnet over HTTPS.
name: meshmap-tailscale

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-meshmap}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"                              # no /dev/net/tun or NET_ADMIN needed
      TS_SERVE_CONFIG: /config/${TS_MODE:-serve}.json   # serve = tailnet only, funnel = public internet
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config:/config:ro
    networks:
      - meshmap
    restart: unless-stopped

networks:
  meshmap:
    name: meshmap-net
    external: true   # created by the root docker-compose.yml

volumes:
  tailscale-state:
