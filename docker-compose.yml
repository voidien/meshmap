name: meshmap
services:
  meshmap:
    build: .
    image: meshmap:v4
    container_name: meshmap
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${MESHMAP_PORT:-9091}:8080"   # host port -> the meshmap server in the container
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data               # accounts, passkeys and projects (meshmap.db): back this folder up
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G           # coverage jobs hold terrain tiles and result rasters in memory

  # Builds terrain packs into ./data/packs:  docker compose --profile etl run --rm etl build --id nashville --bbox=... (see tools/etl/README.md)
  etl:
    profiles: ["etl"]
    build: ./tools/etl
    image: meshmap-etl:v4
    volumes:
      - ./data:/app/data
    working_dir: /app
