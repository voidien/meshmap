services:
  meshmap:
    build: .
    image: meshmap:v0
    container_name: meshmap
    restart: unless-stopped
    ports:
      - "${MESHMAP_PORT:-9091}:8080"   # host port -> nginx in the container
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128M
